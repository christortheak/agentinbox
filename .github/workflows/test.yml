name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tests
        run: |
          python -m pip install pytest
          python -m pytest mailexport/tests -q
      - name: Build the calendar tool
        working-directory: calexport
        run: swift build
      - name: Network code stays in the settings page
        run: |
          hits=$(grep -rlnE "^(import|from) (smtplib|socket|http|urllib|requests)" mailexport/src || true)
          test "$hits" = "mailexport/src/mailexport/configui.py"
          ! grep -rn "URLSession" calexport/Sources
      - name: calexport writes only reminders
        run: |
          test "$(grep -c 'store.save' calexport/Sources/calexport/main.swift)" = "2"
          ! grep -n 'store.remove' calexport/Sources/calexport/main.swift
