[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailexport"
version = "0.4.0"
description = "AgentInbox read-only Mail.app exporter, attachment fetcher, and CLI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentinbox = "mailexport.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
